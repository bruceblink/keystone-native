services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: keystone
      MYSQL_USER: keystone
      MYSQL_PASSWORD: keystone
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukeystone", "-pkeystone"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/keystone
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
      JWT_PRIVATE_KEY_LOCATION: /run/keys/privateKey.pem
      JWT_PUBLIC_KEY_LOCATION: /run/keys/publicKey.pem
      JWT_KEY_ID: ${JWT_KEY_ID:?JWT_KEY_ID is required}
      # Compose 是本地 HTTP 验收入口；生产部署必须通过 HTTPS 终止层并显式开启 HTTP_REQUIRE_HTTPS。
      HTTP_REQUIRE_HTTPS: "false"
      HTTP_HSTS_ENABLED: "false"
      HTTP_CORS_ENABLED: "false"
    volumes:
      - ./docker/keys:/run/keys:ro
    ports: ["8080:8080"]
