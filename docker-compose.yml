services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: keystone
      MYSQL_USER: keystone
      MYSQL_PASSWORD: keystone
      MYSQL_ROOT_PASSWORD: root
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ukeystone", "-pkeystone"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/keystone
      DB_USERNAME: keystone
      DB_PASSWORD: keystone
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    ports: ["8080:8080"]
