quarkus.http.test-port=0
quarkus.http.cors.enabled=false
keystone.security.http.cors-origins=__unset__
keystone.security.http.require-https=false
keystone.security.http.trust-forwarded-proto=false
keystone.security.http.hsts=false
keystone.security.jwt.public-key-location=keys/publicKey.pem
mp.jwt.verify.publickey.location=keys/publicKey.pem
smallrye.jwt.sign.key.location=keys/privateKey.pem
keystone.security.jwt.key-id=test-rs256-1
keystone.security.jwt.jwk-keys=none
keystone.security.jwt.registry.expiry-days=30
mp.jwt.verify.audiences=keystone-api
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=30
smallrye.jwt.required.claims=iss,sub,aud,jti,sid,iat,exp,permission_version
keystone.file.root=build/test-files
keystone.security.api-key.last-used-update-interval-seconds=60
keystone.security.api-key.rate-limit.max-failures=20
keystone.security.api-key.rate-limit.window-seconds=60
keystone.security.api-key.rate-limit.block-seconds=300
keystone.security.login.max-failures=10
keystone.security.login.window-seconds=60
keystone.security.login.block-seconds=300
keystone.security.login.account-lock-base-seconds=60
keystone.security.login.account-lock-max-seconds=900
keystone.security.audit.cleanup.enabled=false
keystone.security.audit.retention-days=90
keystone.security.audit.max-events=1000000
keystone.security.audit.cleanup-batch-size=500
keystone.security.password.min-length=8
keystone.security.password.require-uppercase=false
keystone.security.password.require-lowercase=false
keystone.security.password.require-digit=false
keystone.security.password.require-special=false
keystone.security.password.disallowed=test-only-disallowed
keystone.security.mfa.master-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
keystone.security.mfa.master-key-version=1
keystone.security.mfa.recovery-pepper=test-only-pepper
keystone.security.mfa.challenge-lifetime-seconds=300
keystone.security.mfa.issuer=Keystone
keystone.security.mfa.rate-limit.max-failures=5
keystone.security.mfa.rate-limit.window-seconds=60
keystone.security.mfa.rate-limit.block-seconds=300
keystone.security.network.trusted-proxy-cidrs=127.0.0.1/32
keystone.security.oidc.enabled=false
keystone.security.oidc.request-ttl-seconds=300
keystone.security.oidc.http-timeout-seconds=5
keystone.security.webauthn.enabled=false
keystone.security.webauthn.origin=http://localhost:8080
keystone.security.webauthn.rp-id=localhost
quarkus.webauthn.enabled=true
quarkus.webauthn.origins=http://localhost:8080
quarkus.webauthn.relying-party.id=localhost
quarkus.webauthn.relying-party.name=Keystone Native Test
quarkus.webauthn.user-verification=required
quarkus.webauthn.user-presence-required=true
quarkus.webauthn.attestation=none
quarkus.http.auth.session.encryption-key=test-only-webauthn-session-encryption-key
