quarkus.application.name=keystone-native
quarkus.http.port=8080
quarkus.http.root-path=/api
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/keystone}
quarkus.datasource.username=${DB_USERNAME:keystone}
quarkus.datasource.password=${DB_PASSWORD:keystone}
quarkus.datasource.jdbc.max-size=16
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
mp.jwt.verify.issuer=${JWT_ISSUER:keystone-native}
mp.jwt.verify.audiences=${JWT_AUDIENCE:keystone-api}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=30
smallrye.jwt.required.claims=iss,sub,aud,jti,sid,iat,exp
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:keys/publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
smallrye.jwt.algorithm=RS256
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:keys/publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.scheduler.enabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
keystone.file.root=${FILE_STORAGE_ROOT:./data/files}
