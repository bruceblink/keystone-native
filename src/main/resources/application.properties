quarkus.application.name=keystone-native
quarkus.http.port=8080
quarkus.http.root-path=/api
# 浏览器跨域默认关闭。启用时必须通过 HTTP_CORS_ORIGINS 显式列出来源。
quarkus.http.cors.enabled=${HTTP_CORS_ENABLED:false}
keystone.security.http.cors-origins=${HTTP_CORS_ORIGINS:__unset__}
quarkus.http.cors.origins=${HTTP_CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=${HTTP_CORS_METHODS:GET,POST,PUT,DELETE,OPTIONS}
quarkus.http.cors.headers=${HTTP_CORS_HEADERS:Authorization,Content-Type,X-Request-ID}
quarkus.http.cors.exposed-headers=${HTTP_CORS_EXPOSED_HEADERS:Location,X-Request-ID}
quarkus.http.cors.access-control-allow-credentials=${HTTP_CORS_ALLOW_CREDENTIALS:false}
# 生产默认要求 HTTPS。Docker Compose 本地入口明确关闭该要求，避免破坏本地 HTTP 验收。
keystone.security.http.require-https=${HTTP_REQUIRE_HTTPS:false}
keystone.security.http.trust-forwarded-proto=${HTTP_TRUST_FORWARDED_PROTO:false}
keystone.security.http.hsts=${HTTP_HSTS_ENABLED:false}
%prod.keystone.security.http.require-https=${HTTP_REQUIRE_HTTPS:true}
%prod.keystone.security.http.hsts=${HTTP_HSTS_ENABLED:true}
%test.keystone.security.http.require-https=false
%test.keystone.security.http.hsts=false
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/keystone}
quarkus.datasource.username=${DB_USERNAME:keystone}
quarkus.datasource.password=${DB_PASSWORD:keystone}
quarkus.datasource.jdbc.max-size=16
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.sql-load-script=no-file
mp.jwt.verify.issuer=${JWT_ISSUER:keystone-native}
mp.jwt.verify.audiences=${JWT_AUDIENCE:keystone-api}
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=30
smallrye.jwt.required.claims=iss,sub,aud,jti,sid,iat,exp,permission_version
# `keystone.security.jwt.public-key-location` 是 JWK 发布器读取的单个 PEM。
# 单 key 可以使用 PEM。启用重叠 key 时，JWT_VERIFY_PUBLIC_KEY_LOCATION 必须指向
# 包含全部公钥的 JWK Set 文件或 HTTPS JWK Set URL；否则 SmallRye 只会验证主 PEM。
keystone.security.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_LOCATION}}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
smallrye.jwt.algorithm=RS256
%prod.mp.jwt.verify.publickey.location=${JWT_VERIFY_PUBLIC_KEY_LOCATION:${JWT_PUBLIC_KEY_LOCATION}}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
keystone.security.jwt.key-id=${JWT_KEY_ID:}
keystone.security.jwt.jwk-cache-seconds=${JWT_JWK_CACHE_SECONDS:60}
keystone.security.jwt.jwk-keys=${JWT_JWK_KEYS:none}
keystone.security.jwt.registry.expiry-days=${JWT_REGISTRY_RETIRING_EXPIRY_DAYS:30}
keystone.security.network.trusted-proxy-cidrs=${TRUSTED_PROXY_CIDRS:}
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger
quarkus.scheduler.enabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
keystone.file.root=${FILE_STORAGE_ROOT:./data/files}
keystone.security.api-key.last-used-update-interval-seconds=${API_KEY_LAST_USED_UPDATE_INTERVAL_SECONDS:60}
keystone.security.api-key.rate-limit.max-failures=${API_KEY_RATE_MAX_FAILURES:20}
keystone.security.api-key.rate-limit.window-seconds=${API_KEY_RATE_WINDOW_SECONDS:60}
keystone.security.api-key.rate-limit.block-seconds=${API_KEY_RATE_BLOCK_SECONDS:300}
keystone.security.login.max-failures=${LOGIN_RATE_MAX_FAILURES:10}
keystone.security.login.window-seconds=${LOGIN_RATE_WINDOW_SECONDS:60}
keystone.security.login.block-seconds=${LOGIN_RATE_BLOCK_SECONDS:300}
keystone.security.login.account-lock-base-seconds=${ACCOUNT_LOCK_BASE_SECONDS:60}
keystone.security.login.account-lock-max-seconds=${ACCOUNT_LOCK_MAX_SECONDS:900}
# 安全事件按时间和总量双重边界清理；生产启用，测试环境在 test profile 中关闭。
keystone.security.audit.cleanup.enabled=${SECURITY_EVENT_CLEANUP_ENABLED:true}
keystone.security.audit.retention-days=${SECURITY_EVENT_RETENTION_DAYS:90}
keystone.security.audit.max-events=${SECURITY_EVENT_MAX_EVENTS:1000000}
keystone.security.audit.cleanup-batch-size=${SECURITY_EVENT_CLEANUP_BATCH_SIZE:500}
keystone.security.password.min-length=${PASSWORD_MIN_LENGTH:12}
keystone.security.password.require-uppercase=${PASSWORD_REQUIRE_UPPERCASE:true}
keystone.security.password.require-lowercase=${PASSWORD_REQUIRE_LOWERCASE:true}
keystone.security.password.require-digit=${PASSWORD_REQUIRE_DIGIT:true}
keystone.security.password.require-special=${PASSWORD_REQUIRE_SPECIAL:true}
keystone.security.password.disallowed=${PASSWORD_DISALLOWED:password,password1,1234567890,qwerty123,admin}
keystone.security.mfa.master-key=${MFA_MASTER_KEY:}
keystone.security.mfa.master-key-version=${MFA_MASTER_KEY_VERSION:1}
keystone.security.mfa.recovery-pepper=${MFA_RECOVERY_PEPPER:}
keystone.security.mfa.challenge-lifetime-seconds=${MFA_CHALLENGE_LIFETIME_SECONDS:300}
keystone.security.mfa.issuer=${MFA_ISSUER:Keystone}
keystone.security.mfa.rate-limit.max-failures=${MFA_RATE_MAX_FAILURES:5}
keystone.security.mfa.rate-limit.window-seconds=${MFA_RATE_WINDOW_SECONDS:60}
keystone.security.mfa.rate-limit.block-seconds=${MFA_RATE_BLOCK_SECONDS:300}
