name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: keystone
          MYSQL_USER: keystone
          MYSQL_PASSWORD: keystone
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ukeystone -pkeystone"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: gradle
      - name: Validate and compile
        run: ./gradlew --no-daemon compileJava
      - name: Run tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/keystone
          DB_USERNAME: keystone
          DB_PASSWORD: keystone
        run: ./gradlew --no-daemon test
      - name: Package JVM artifact
        run: ./gradlew --no-daemon quarkusBuild -x test

  native-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build native container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: keystone-native:native-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
