name: Build and publish release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: keystone
          MYSQL_USER: keystone
          MYSQL_PASSWORD: keystone
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ukeystone -pkeystone"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '25'
          cache: gradle
      - name: Run tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/keystone
          DB_USERNAME: keystone
          DB_PASSWORD: keystone
        run: ./gradlew --no-daemon test
      - name: Package JVM artifact
        run: ./gradlew --no-daemon quarkusBuild -x test

  release-image:
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: keystone
          MYSQL_USER: keystone
          MYSQL_PASSWORD: keystone
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ukeystone -pkeystone"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release images require a stable semantic version tag such as v0.1.0" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enforce source file size limit
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "${file}")
            if (( lines > 600 )); then
              echo "${file} has ${lines} lines; source files must stay at or below 600 lines" >&2
              exit 1
            fi
          done < <(find src/main/java src/test/java -type f -name '*.java' -print0)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign release image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Pull release image for smoke test
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.version }}
        run: docker pull "${IMAGE_REF}"

      - name: Run release smoke test
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          container_name="keystone-native-release-smoke"
          cleanup() {
            docker logs "${container_name}" 2>&1 || true
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "${container_name}" --network host \
            -v "${GITHUB_WORKSPACE}/src/test/resources/keys:/run/keys:ro" \
            -e DB_URL=jdbc:mysql://127.0.0.1:3306/keystone \
            -e DB_USERNAME=keystone \
            -e DB_PASSWORD=keystone \
            -e JWT_PRIVATE_KEY_LOCATION=file:///run/keys/privateKey.pem \
            -e JWT_PUBLIC_KEY_LOCATION=file:///run/keys/publicKey.pem \
            -e JWT_KEY_ID=ci-rs256-1 \
            -e MFA_MASTER_KEY="$(openssl rand -hex 32)" \
            -e MFA_RECOVERY_PEPPER="$(openssl rand -hex 32)" \
            -e HTTP_REQUIRE_HTTPS=false \
            -e HTTP_HSTS_ENABLED=false \
            -e KEYSTONE_SECURITY_HTTP_REQUIRE_HTTPS=false \
            -e KEYSTONE_SECURITY_HTTP_HSTS=false \
            -e HTTP_CORS_ENABLED=false \
            "${IMAGE_REF}"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Native release image did not become healthy" >&2
          exit 1
