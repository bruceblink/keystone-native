org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# The runtime image exposes a JRE at /usr/lib/jvm, while this workspace
# provides a complete GraalVM JDK for Gradle compilation and Native Image.
org.gradle.java.home=/workspace/tools/graalvm-community-25.5.5.0.3+1.1
quarkusPluginVersion=3.40.1

# The build sandbox requires the configured HTTP proxy for Gradle plugin and dependency resolution.
systemProp.http.proxyHost=proxy
systemProp.http.proxyPort=8080
systemProp.https.proxyHost=proxy
systemProp.https.proxyPort=8080
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
systemProp.https.nonProxyHosts=localhost|127.*|[::1]
